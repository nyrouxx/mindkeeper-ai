name: Checks and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools
      - run: python -m unittest discover -s tests
      - run: node --test tests/test_panel.cjs
      - run: python tools/check_release.py
      - run: python tools/build_release.py

  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/build_release.py
      - name: Publish version from manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/personal_secretary/manifest.json"))["version"])')
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$version" dist/mindkeeper_ai.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "mindKeeper AI $version" --notes-file CHANGELOG.md
